<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>DANK — تواصل بحرية</title>
    <meta name="description" content="DANK - تواصل بحرية. Real-time private messaging, communities, channels, updates, and calls." />
    <meta name="theme-color" content="#040409" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DANK" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:site_name" content="DANK" />
    <meta property="og:title" content="DANK — تواصل بحرية" />
    <meta property="og:description" content="DANK - تواصل بحرية. Real-time private messaging, communities, channels, updates, and calls." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      @keyframes dank-hello-gradient {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
      #dank-boot-splash {
        position: fixed;
        inset: 0;
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
        background-color: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        overflow: hidden;
      }
      #dank-boot-hello {
        margin: 0;
        font-family: 'Cairo', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: clamp(3rem, 11vw, 5rem);
        font-weight: 800;
        line-height: 1.25;
        text-align: center;
        background-image: linear-gradient(110deg, #3B82F6 0%, #A855F7 30%, #EC4899 62%, #F97316 88%, #3B82F6 100%);
        background-size: 240% 240%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        animation: dank-hello-gradient 3.6s ease infinite;
      }
      #dank-boot-copyright {
        position: fixed;
        bottom: 24px;
        left: 0;
        right: 0;
        margin: 0;
        padding: 0 16px;
        text-align: center;
        font-family: 'Cairo', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 12px;
        font-weight: 400;
        color: #A1A1AA;
        letter-spacing: 0.01em;
      }
    </style>
    <script>
      try {
        var lang = localStorage.getItem('dank_lang');
        if (lang === 'en') {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
        } else {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        }
        var storedTheme = localStorage.getItem('dank_theme');
        var isLight = storedTheme === 'light';
        document.documentElement.dataset.theme = isLight ? 'light' : 'arcade';
        if (!isLight) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Handjet:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#000000] text-white antialiased selection:bg-[#A855F7]/30">
    <div id="root">
      <div id="dank-boot-splash" aria-label="Welcome">
        <span id="dank-boot-hello" dir="rtl" lang="ar">مرحبًا</span>
        <p id="dank-boot-copyright" dir="rtl">© 2027 YOUSSEF DANK - جميع الحقوق محفوظة</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
