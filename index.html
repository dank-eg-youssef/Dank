    <script>
      (function () {
        try {
          var lang = localStorage.getItem('dank_lang');
          if (lang === 'en') {
            document.documentElement.lang = 'en';
            document.documentElement.dir = 'ltr';
          } else {
            document.documentElement.lang = 'ar';
            document.documentElement.dir = 'rtl';
          }
          document.documentElement.dataset.theme = 'arcade';
          document.documentElement.style.colorScheme = 'dark';
          document.documentElement.style.backgroundColor = '#040409';
          document.documentElement.classList.add('dark');
          try {
            localStorage.setItem('dank_theme', 'arcade');
          } catch (e) {}
          var metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) {
            metaThemeColor.setAttribute('content', '#040409');
          }
        } catch (e) {}
      })();
    </script>
