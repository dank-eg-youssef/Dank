<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DANK — Real-Time Messaging</title>
    <meta name="description" content="DANK is a real-time messaging platform for private chats, groups, broadcast channels, stories, posts, and reels." />
    <meta name="theme-color" content="#0A1931" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DANK" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:site_name" content="DANK" />
    <meta property="og:title" content="DANK — Real-Time Messaging" />
    <meta property="og:description" content="DANK is a real-time messaging platform for private chats, groups, broadcast channels, stories, posts, and reels." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      @keyframes dank-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #dank-boot-splash {
        min-height: 100vh;
        width: 100%;
        background-color: #0A1931;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
        box-sizing: border-box;
      }
      #dank-boot-logo-wrap {
        width: 80px;
        height: 80px;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.45), 0 0 0 2px rgba(56, 189, 248, 0.35);
      }
      #dank-boot-title {
        margin: 0;
        color: #FFFFFF;
        font-family: 'Poppins', 'Cairo', system-ui, -apple-system, sans-serif;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      #dank-boot-spinner {
        width: 36px;
        height: 36px;
        border-radius: 9999px;
        border: 3px solid rgba(56, 189, 248, 0.25);
        border-top-color: #38BDF8;
        animation: dank-boot-spin 0.8s linear infinite;
      }
    </style>
    <script>
      try {
        var lang = localStorage.getItem('dank_lang');
        if (lang === 'en') {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
        } else {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#0A1931] text-[#0A1931] antialiased selection:bg-[#38BDF8]/30 selection:text-[#0A1931]">
    <div id="root">
      <div id="dank-boot-splash" aria-label="DANK">
        <div id="dank-boot-logo-wrap">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="80" height="80">
            <rect width="512" height="512" fill="#0A1931" />
            <path d="M256 108c-81.7 0-148 66.3-148 148 0 31.3 9.7 60.4 26.3 84.3L116 396l57.7-17.8c23.7 15.1 51.9 23.8 82.3 23.8 81.7 0 148-66.3 148-148S337.7 108 256 108Z" stroke="#38BDF8" stroke-width="22" stroke-linejoin="round" />
            <path d="M342 184L174 252l63 22 25 65 80-155Z" fill="#38BDF8" />
            <path d="M237 274l105-90-80 155-25-65Z" fill="#0EA5E9" />
          </svg>
        </div>
        <h1 id="dank-boot-title">DANK</h1>
        <div id="dank-boot-spinner" role="status" aria-label="Loading"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
