    <script>
      (function () {
        try {
          var lang = localStorage.getItem('era_lang');
          if (lang === 'en') {
            document.documentElement.lang = 'en';
            document.documentElement.dir = 'ltr';
          } else {
            document.documentElement.lang = 'ar';
            document.documentElement.dir = 'rtl';
          }
          document.documentElement.dataset.theme = 'arcade';
          document.documentElement.style.colorScheme = 'dark';
          document.documentElement.style.backgroundColor = '#040409';
          document.documentElement.classList.add('dark');
          try {
            localStorage.setItem('era_theme', 'arcade');
          } catch (e) {}
          var metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) {
            metaThemeColor.setAttribute('content', '#040409');
          }
          var targetVer = '2.0.0';
          var currentPrefix = 'era-v' + targetVer;
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) {
                if (/dank/i.test(k) || k.indexOf(currentPrefix) !== 0) {
                  caches.delete(k);
                }
              });
            }).catch(function () {});
          }
          if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (reg) {
                if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                reg.update().catch(function () {});
              });
            }).catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
